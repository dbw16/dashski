[project]
name = "dashski"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.139.0",
    "jinja2>=3.1.6",
    "uvicorn[standard]>=0.51.0",
]

[build-system]
requires = ["uv_build>=0.11.6,<0.12"]
build-backend = "uv_build"

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]
preset = "strict"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]

[tool.ruff.lint.isort]
known-first-party = ["dashski"]

[tool.ruff.format]
docstring-code-format = true

[tool.djlint]
profile = "jinja"
extension = "html"
indent = 2
# H030/H031: meta description/keywords don't apply to an internal dashboard.
ignore = "H030,H031"

[dependency-groups]
dev = [
    "beautifulsoup4>=4.15.0",
    "djlint>=1.40.4",
    "httpx2>=0.28.1",
    "pyrefly>=1.1.1",
    "pytest>=9.1.1",
    "ruff>=0.15.21",
]
