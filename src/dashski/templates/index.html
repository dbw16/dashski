<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dashski</title>
    <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}" />
    <script src="https://unpkg.com/htmx.org@2.0.4" defer></script>
  </head>
  <body>
    <div class="page">
      <header class="page-header">
        <h1>Dashski</h1>
        <p class="subtitle">South Island avalanche danger at a glance</p>
      </header>
      <input type="hidden" id="as-of-value" name="as_of" value="" />
      <section class="card widget-toolbar"
               id="asof-slider"
               hx-get="/api/snapshots"
               hx-trigger="load, every 60s[dashskiIsLive()]">
        <p class="muted">Loading history…</p>
      </section>
      <section class="card widget widget-toolbar"
               id="widget-advisory"
               hx-get="/api/widget/advisory"
               hx-include="#as-of-value"
               hx-trigger="load, every 60s[dashskiIsLive()], asof-changed from:body delay:150ms">
        <h2>Avalanche advisory</h2>
        <p class="muted">Loading…</p>
      </section>
    </div>
    <script>
      // Canonical state is the global snapshot index; the year and date sliders
      // are projections of it. Parsing and year-grouping are cached because
      // dragging fires dashskiUpdate per pixel.
      let dashskiIndex = 0;
      let dashskiCache = { raw: null, snapshots: [], years: [], yearOf: [] };
      const dashskiYearFmt = new Intl.DateTimeFormat("en-NZ", {
        timeZone: "Pacific/Auckland",
        year: "numeric",
      });

      function dashskiData() {
        const el = document.querySelector("#asof-slider [data-snapshots]");
        const raw = el ? el.dataset.snapshots : "[]";
        if (raw !== dashskiCache.raw) {
          const snapshots = JSON.parse(raw);
          const yearOf = snapshots.map((iso) =>
            Number(dashskiYearFmt.format(new Date(iso.endsWith("Z") ? iso : iso + "Z"))));
          dashskiCache = { raw, snapshots, yearOf, years: [...new Set(yearOf)] };
        }
        return dashskiCache;
      }

      // Polling re-renders the advisory widget, which would collapse whatever
      // the reader had open, so open regions are remembered across swaps.
      const dashskiOpenRegions = new Set();

      document.body.addEventListener("toggle", (e) => {
        const region = e.target.dataset && e.target.dataset.region;
        if (!region) return;
        if (e.target.open) dashskiOpenRegions.add(region);
        else dashskiOpenRegions.delete(region);
      }, true); // capture: toggle does not bubble

      document.body.addEventListener("htmx:afterSwap", () => {
        document.querySelectorAll("details[data-region]").forEach((el) => {
          el.open = dashskiOpenRegions.has(el.dataset.region);
        });
      });

      // The slider fragment cannot init itself with an inline script: during
      // the swap the old fragment is still in the DOM ahead of the new one, so
      // every id lookup would hit the old elements, and htmx's settle phase
      // then restores the incoming markup's attributes anyway. afterSettle is
      // the first moment writes stick. Swaps only happen while Live, so
      // jumping to the newest snapshot is always right.
      document.body.addEventListener("htmx:afterSettle", (e) => {
        if (e.detail.target.id !== "asof-slider") return;
        dashskiUpdate(dashskiData().snapshots.length - 1);
      });

      function dashskiIsLive() {
        const el = document.getElementById("as-of-value");
        return !el || el.value === "";
      }

      // Snapshots are naive UTC on the wire; the whole UI reads in NZ local time.
      // The server's `nz` filter minus zone and year — the slider head is the
      // widest thing on a phone; the year row and sub line carry the year.
      function dashskiFormatNZ(iso) {
        const d = new Date(iso.endsWith("Z") ? iso : iso + "Z");
        return d
          .toLocaleString("en-NZ", {
            timeZone: "Pacific/Auckland",
            weekday: "short",
            day: "2-digit",
            month: "short",
            hour: "2-digit",
            minute: "2-digit",
            hour12: false,
          })
          .replace(",", ""); // "Sun, 26 Jul" -> "Sun 26 Jul", as the server writes it
      }

      function dashskiAgo(iso) {
        const then = new Date(iso.endsWith("Z") ? iso : iso + "Z");
        const mins = Math.round((Date.now() - then) / 60000);
        if (mins < 1) return "just now";
        if (mins < 60) return mins + " min ago";
        const hours = Math.round(mins / 60);
        if (hours < 48) return hours + (hours === 1 ? " hour ago" : " hours ago");
        return Math.round(hours / 24) + " days ago";
      }

      // The thumb's own position drives the filled portion of the track. The
      // var lives on the row, not the range: htmx's settle phase restores the
      // incoming markup's attributes on id-matched elements, so a style set
      // on #asof-range during a swap is wiped ~20ms later.
      function dashskiSyncRange(range, value, max) {
        range.max = max;
        range.value = value;
        const fill = max > 0 ? (value / max) * 100 : 100; // lone position: full track
        range.closest(".asof-controls").style.setProperty("--asof-fill", fill + "%");
      }

      function dashskiUpdate(index) {
        const { snapshots, years, yearOf } = dashskiData();
        const range = document.getElementById("asof-range");
        const label = document.getElementById("asof-label");
        const hidden = document.getElementById("as-of-value");
        if (!snapshots.length || !range || !label || !hidden) return;
        index = Math.max(0, Math.min(snapshots.length - 1, Number(index)));
        dashskiIndex = index;
        const live = index === snapshots.length - 1;
        hidden.value = live ? "" : snapshots[index];

        const year = yearOf[index];
        const yearStart = yearOf.indexOf(year);
        const yearCount = yearOf.lastIndexOf(year) - yearStart + 1;
        dashskiSyncRange(range, index - yearStart, yearCount - 1);

        const yearRange = document.getElementById("asof-year-range");
        document.querySelector(".asof-year").hidden = years.length < 2;
        document.getElementById("asof-year-label").textContent = year;
        dashskiSyncRange(yearRange, years.indexOf(year), years.length - 1);
        yearRange.setAttribute("aria-valuetext", String(year));

        label.textContent = live ? "Live" : dashskiFormatNZ(snapshots[index]);
        document.getElementById("asof-sub").textContent = live
          ? "Newest of " + snapshots.length + (snapshots.length === 1 ? " snapshot" : " snapshots")
          : dashskiAgo(snapshots[index]) + " · " + (index - yearStart + 1) + " of " + yearCount
            + (years.length > 1 ? " in " + year : "");
        document.getElementById("asof-dot").classList.toggle("status-dot-past", !live);
        document.getElementById("asof-live").hidden = live;

        range.setAttribute("aria-valuetext", label.textContent);
        document.body.dispatchEvent(new Event("asof-changed"));
      }

      function dashskiSetOffset(offset) {
        const { yearOf } = dashskiData();
        dashskiUpdate(yearOf.indexOf(yearOf[dashskiIndex]) + Number(offset));
      }

      // Picking a year lands on its newest snapshot, so the newest year is Live.
      function dashskiSetYear(yearIdx) {
        const { years, yearOf } = dashskiData();
        const year = years[Math.max(0, Math.min(years.length - 1, Number(yearIdx)))];
        dashskiUpdate(yearOf.lastIndexOf(year));
      }

      function dashskiStep(delta) {
        dashskiUpdate(dashskiIndex + delta);
      }
    </script>
  </body>
</html>
