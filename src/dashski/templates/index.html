<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dashski</title>
    <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}" />
    <script src="https://unpkg.com/htmx.org@2.0.4" defer></script>
  </head>
  <body>
    <div class="page">
      <header class="page-header">
        <h1>Dashski</h1>
        <p class="subtitle">South Island snow at a glance</p>
      </header>
      <div class="actions widget-toolbar">
        <button class="btn"
                hx-post="/api/refresh"
                hx-target="#refresh-status"
                hx-swap="outerHTML">Force refresh</button>
        <span id="refresh-status" class="muted"></span>
      </div>
      <section class="widget-grid">
        <section class="card widget"
                 id="widget-forecast"
                 hx-get="/api/widget/forecast"
                 hx-trigger="load, every 60s, refresh-done from:body">
          <h2>Forecast</h2>
          <p class="muted">Loading…</p>
        </section>
        <section class="card widget"
                 id="widget-observation"
                 hx-get="/api/widget/observation"
                 hx-trigger="load, every 60s, refresh-done from:body">
          <h2>Observations</h2>
          <p class="muted">Loading…</p>
        </section>
        <section class="card widget"
                 id="widget-snow-report"
                 hx-get="/api/widget/snow-report"
                 hx-trigger="load, every 60s, refresh-done from:body">
          <h2>Snow reports</h2>
          <p class="muted">Loading…</p>
        </section>
      </section>
    </div>
  </body>
</html>
