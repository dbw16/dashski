<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashski</title>
  <link rel="stylesheet" href="/static/style.css" />
  <script src="https://unpkg.com/htmx.org@2.0.4" defer></script>
</head>
<body>
  <div class="page">
    <header class="page-header">
      <h1>Dashski</h1>
      <p class="subtitle">Hello, world — FastAPI + HTMX</p>
    </header>

    <section class="stat-grid">
      <div class="stat-tile">
        <span class="stat-label">
          <span class="status-dot" aria-hidden="true"></span>
          Status
        </span>
        <span class="stat-value">Online</span>
      </div>

      <div class="stat-tile">
        <span class="stat-label">Server time</span>
        {% include "_time.html" %}
      </div>

      <div class="stat-tile">
        <span class="stat-label">Pings received</span>
        {% include "_ping.html" %}
      </div>

      <div class="stat-tile">
        <span class="stat-label">Stack</span>
        <span class="stat-value">FastAPI + HTMX</span>
      </div>
    </section>

    <section class="card">
      <h2>Live demo</h2>
      <p class="muted">
        These buttons call the server over HTMX and swap just the tile above —
        no full page reload, no client-side JavaScript framework.
      </p>
      <div class="actions">
        <button class="btn" hx-get="/api/time" hx-target="#server-time" hx-swap="outerHTML">
          Refresh time
        </button>
        <button class="btn btn-primary" hx-post="/api/ping" hx-target="#ping-count" hx-swap="outerHTML">
          Ping server
        </button>
      </div>
    </section>
  </div>
</body>
</html>
