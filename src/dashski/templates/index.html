<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dashski</title>
    <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}" />
    <script src="https://unpkg.com/htmx.org@2.0.4" defer></script>
  </head>
  <body>
    <div class="page">
      <header class="page-header">
        <h1>Dashski</h1>
        <p class="subtitle">South Island snow at a glance</p>
      </header>
      <div class="actions widget-toolbar">
        <button class="btn"
                hx-post="/api/refresh"
                hx-target="#refresh-status"
                hx-swap="outerHTML">Force refresh</button>
        <span id="refresh-status" class="muted"></span>
      </div>
      <input type="hidden" id="as-of-value" name="as_of" value="" />
      <section class="card widget-toolbar"
               id="asof-slider"
               hx-get="/api/snapshots"
               hx-trigger="load, every 60s[dashskiIsLive()]">
        <p class="muted">Loading history…</p>
      </section>
      <section class="widget-grid">
        <section class="card widget"
                 id="widget-forecast"
                 hx-get="/api/widget/forecast"
                 hx-trigger="load, every 60s, refresh-done from:body">
          <h2>Forecast</h2>
          <p class="muted">Loading…</p>
        </section>
        <section class="card widget"
                 id="widget-observation"
                 hx-get="/api/widget/observation"
                 hx-include="#as-of-value"
                 hx-trigger="load, every 60s[dashskiIsLive()], refresh-done[dashskiIsLive()] from:body, asof-changed from:body delay:150ms">
          <h2>Observations</h2>
          <p class="muted">Loading…</p>
        </section>
        <section class="card widget"
                 id="widget-snow-report"
                 hx-get="/api/widget/snow-report"
                 hx-include="#as-of-value"
                 hx-trigger="load, every 60s[dashskiIsLive()], refresh-done[dashskiIsLive()] from:body, asof-changed from:body delay:150ms">
          <h2>Snow reports</h2>
          <p class="muted">Loading…</p>
        </section>
      </section>
    </div>
    <script>
      function dashskiSnapshots() {
        const el = document.querySelector("#asof-slider [data-snapshots]");
        return el ? JSON.parse(el.dataset.snapshots) : [];
      }

      function dashskiIsLive() {
        const el = document.getElementById("as-of-value");
        return !el || el.value === "";
      }

      function dashskiFormatUTC(iso) {
        const d = new Date(iso.endsWith("Z") ? iso : iso + "Z");
        return (
          d.toLocaleString("en-NZ", { timeZone: "UTC", dateStyle: "medium", timeStyle: "short" }) +
          " UTC"
        );
      }

      function dashskiUpdate(index) {
        const snapshots = dashskiSnapshots();
        const range = document.getElementById("asof-range");
        const label = document.getElementById("asof-label");
        const hidden = document.getElementById("as-of-value");
        if (!snapshots.length || !range || !label || !hidden) return;
        index = Math.max(0, Math.min(snapshots.length - 1, Number(index)));
        range.value = index;
        const live = index === snapshots.length - 1;
        hidden.value = live ? "" : snapshots[index];
        label.textContent = live ? "Live" : "Snapshot: " + dashskiFormatUTC(snapshots[index]);
        document.body.dispatchEvent(new Event("asof-changed"));
      }

      function dashskiStep(delta) {
        const range = document.getElementById("asof-range");
        if (range) dashskiUpdate(Number(range.value) + delta);
      }
    </script>
  </body>
</html>
